spring.application.name=restaurante

# CONEXION A BASE DE DATOS (Mapeo Inteligente Local / Railway)
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# CONFIGURACION JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CONTROL DE PESO MULTIPART (Vouchers de Auditoria)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# INTEGRACION API DE FACTURACION ELECTRONICA (SUNAT)
miapi.facturacion.url=${MIAPI_FACTURACION_URL}
miapi.facturacion.token=${MIAPI_FACTURACION_TOKEN}

# ALMACENAMIENTO DE IMAGENES (Referencia Circular Saneada)
app.images.base-url=${APP_IMAGES_BASE_URL}
app.cloudinary.url=${CLOUDINARY_URL}

server.forward-headers-strategy=framework
