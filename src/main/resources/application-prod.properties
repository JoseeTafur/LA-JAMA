spring.application.name=restaurante

# CONEXIÓN A BASE DE DATOS
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

# CONFIGURACIÓN JPA / HIBERNATE
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CONTROL DE PESO MULTIPART
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# FACTURACIÓN ELECTRÓNICA
miapi.facturacion.url.comprobante=${MIAPI_FACTURACION_URL_COMPROBANTE}
miapi.facturacion.url.nota=${MIAPI_FACTURACION_URL_NOTA}
miapi.facturacion.token=${MIAPI_FACTURACION_TOKEN}

# CONSULTAS DNI / RUC
miapi.url.ruc=${MIAPI_URL_RUC}
miapi.url.dni=${MIAPI_URL_DNI}
miapi.token=${MIAPI_TOKEN}
miapi.cloud.token=${MIAPI_CLOUD_TOKEN}

# CLOUDINARY
app.images.base-url=${APP_IMAGES_BASE_URL}
app.cloudinary.url=${CLOUDINARY_URL}

# GROQ
app.groq.token=${GROQ_API_KEY}
app.groq.url=${GROQ_API_URL}

# SMTP
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}



# URL BASE
app.base-url=https://${RAILWAY_PUBLIC_DOMAIN}

server.forward-headers-strategy=framework