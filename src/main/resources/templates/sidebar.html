<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="sidebar(activeUri)">
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <nav id="sidebar" class="sidebar p-3">

        <div class="bg-cursor-glow header-bg-glow" id="sidebar-glow"></div>
        <div class="pattern-bg ripple-container header-ripple-grid" id="sidebar-ripple"></div>

        <div class="d-flex align-items-center justify-content-between mb-4 px-2 pt-4 position-relative z-2">
            <a th:href="@{/dashboard}" class="text-decoration-none d-inline-block brand-logo-wrapper">
                <img th:src="@{/img/logo.png}" alt="Logo La Jama" id="sidebar-logo"
                     style="width: 150px; max-width: 100%; height: auto; object-fit: contain; transition: all 0.3s ease;">
            </a>

            <button id="toggle-sidebar-desktop" class="btn text-white d-none d-md-inline-block p-1 border-0 bg-transparent" type="button" title="Contraer menú">
                <i class="bi bi-list fs-4"></i>
            </button>

            <button id="close-sidebar" class="btn text-white d-md-none p-0 position-absolute" style="top: 15px; right: 15px;">
                <i class="bi bi-x-lg" style="font-size: 1.2rem;"></i>
            </button>
        </div>

        <hr class="text-white-50 position-relative z-2" />

        <div class="jama-uiverse-container">
            <div class="sidebar-scrollable-menu position-relative">

                <div class="pattern-bg ripple-container header-ripple-grid opacity-25"
                     style="position: absolute; top:0; left:0; width:100%; height:100%; z-index: 1; pointer-events: none;"></div>

                <article class="jama-uiverse-menu position-relative z-2">

                    <label th:each="opcion : ${session.opcionesIndependientes}"
                           th:for="${'radio-' + opcion.nombre}"
                           class="jama-uiverse-item"
                           th:with="uriLimpia=${activeUri != null ? #strings.replace(activeUri, '/admin', '') : ''}"
                           th:classappend="${opcion.ruta == activeUri || opcion.ruta == uriLimpia || (activeUri == '/' && opcion.ruta == '/dashboard')} ? 'active-uiverse' : ''"
                           th:data-module="${#strings.toLowerCase(opcion.nombre)}">

                        <input class="jama-radio-hidden"
                               type="radio"
                               name="sidebar_path"
                               th:id="${'radio-' + opcion.nombre}"
                               th:checked="${opcion.ruta == activeUri || opcion.ruta == uriLimpia || (activeUri == '/' && opcion.ruta == '/dashboard')}"
                               th:onclick="|window.location.href='@{${opcion.ruta}}'|" />

                        <i class="bi jama-uiverse-icon"
                           th:classappend="${opcion.nombre == 'Dashboard' ? 'bi-speedometer2' :
                                           opcion.nombre == 'Usuarios' ? 'bi-person-gear' :
                                           opcion.nombre == 'Perfiles' ? 'bi-shield-lock' :
                                           opcion.nombre == 'Empleados' ? 'bi-people-fill' :
                                           opcion.nombre == 'Insumos' ? 'bi-box-seam' : 'bi-grid-1x2-fill'}"></i>

                        <span class="jama-uiverse-text" th:text="${opcion.nombre}">Dashboard</span>
                    </label>

                    <div th:each="grupo : ${session.menuAgrupado.entrySet()}" class="jama-uiverse-group-wrapper">
                        <th:block th:with="folder=${#strings.toLowerCase(grupo.key)},
    isGroupActive=${activeUri != null && (
        (folder.contains('cocina') && activeUri.contains('/cocina')) ||
        (folder.contains('almacen') && (activeUri.contains('/almacen') || activeUri.contains('/productos'))) ||
        (folder.contains('mesas') && (activeUri.contains('/mesas') || activeUri.contains('/mesero'))) ||
        (folder.contains('mesero') && (activeUri.contains('/mesas') || activeUri.contains('/mesero'))) ||
        (folder.contains('seguridad') && (activeUri.contains('/usuarios') || activeUri.contains('/perfiles') || activeUri.contains('/empleados'))) ||
        (folder.contains('log') && activeUri.contains('/insumos')) ||
        (folder.contains('insumos') && activeUri.contains('/insumos')) ||

        (folder == 'admin' && (
            (activeUri.startsWith('/admin/') && !activeUri.contains('/cocina') && !activeUri.contains('/productos') && !activeUri.contains('/mesas') && !activeUri.contains('/mesero'))
            || activeUri.contains('/pagos-digitales')
        ))
    )}">
                            <label th:for="${'radio-' + grupo.key}"
                                   class="jama-uiverse-item text-between"
                                   th:classappend="${isGroupActive} ? 'active-uiverse' : ''"
                                   data-bs-toggle="collapse"
                                   th:data-bs-target="${'#collapse-' + grupo.key}"
                                   th:aria-expanded="${isGroupActive ? 'true' : 'false'}"
                                   th:data-module="${folder == 'seguridad' ? 'Cajero' : folder}">

                                <input class="jama-radio-hidden"
                                       type="radio"
                                       name="sidebar_path"
                                       th:id="${'radio-' + grupo.key}"
                                       th:checked="${isGroupActive}" />

                                <div class="d-flex align-items-center gap-3">
                                    <i class="bi bi-folder-fill jama-uiverse-icon"
                                       th:classappend="${isGroupActive} ? 'bi-folder2-open' : 'bi-folder-fill'"></i>
                                    <span class="jama-uiverse-text"
                                          th:text="${grupo.key == 'Admin' || folder == 'admin' ? 'Cajero' : grupo.key}">Grupo</span>
                                </div>
                                <i class="bi bi-chevron-down jama-uiverse-arrow"></i>
                            </label>

                            <div th:id="@{'collapse-' + ${grupo.key}}"
                                 class="collapse"
                                 th:classappend="${isGroupActive} ? 'show' : ''">
                                <ul class="submenu-list-uiverse">
                                    <li th:each="opcion : ${grupo.value}">
                                        <a th:href="@{${opcion.ruta}}"
                                           class="submenu-item-uiverse"
                                           th:classappend="${opcion.ruta == activeUri || (activeUri.contains('/mesas') && opcion.ruta.contains('/mesero'))} ? 'active-submenu' : ''">
                                            <i class="bi bi-circle-fill me-2" style="font-size: 0.4rem;"></i>
                                            <span th:text="${opcion.nombre}">Subopción</span>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </th:block>
                    </div>
                </article>
            </div>

            <label for="radio-logout" class="jama-uiverse-item btn-logout-uiverse mt-auto fallback-logout-fixed">
                <input class="jama-radio-hidden"
                       type="radio"
                       name="sidebar_path"
                       id="radio-logout"
                       onclick="sessionStorage.removeItem('jama_sesion_activa'); window.location.href='/logout';" />
                <i class="bi bi-box-arrow-right jama-uiverse-icon"></i>
                <span class="jama-uiverse-text">Cerrar Sesión</span>
            </label>
        </div>
    </nav>
</div>

<header th:fragment="logistica_header(titulo)" class="main-header-banner">
    <div id="stars"></div>
    <div id="stars2"></div>
    <div id="stars3"></div>

    <div class="header-title-container d-flex align-items-center gap-3">
        <button id="open-sidebar" class="btn btn-outline-light border-2 d-md-none rounded-3 px-2 py-1" type="button">
            <i class="bi bi-list fs-4"></i>
        </button>
        <h2 class="header-title fs-5 mb-0" th:text="${titulo}">La Jama</h2>
    </div>

    <div class="d-flex gap-2">
        <button th:if="${titulo == 'Gestión de Usuarios'}"
                id="btnNuevoRegistro"
                class="btn btn-nuevo-jama">
            <i class="bi bi-plus"></i> Nuevo Registro
        </button>
    </div>
</header>

</body>
</html>
