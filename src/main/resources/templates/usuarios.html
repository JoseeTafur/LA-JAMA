<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(title='Usuarios', content=~{::#contenido}, modals=~{::#modales}, js='/js/usuarios.js')}">
<body>

<div id="contenido">
    <div class="card rounded-lg card-color1">
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="card-title h5 fw-bold">Lista de Usuarios</h1>
                <button type="button" id="btnNuevoRegistro" class="btn-jama-kinetic">
                    <i class="bi bi-plus-lg"></i>
                    <span>Nuevo Registro</span>
                </button>
            </div>
            <div class="table-responsive-jama">
                <table id="tabla" class="table table-jama responsive" style="width: 100%">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuario</th>
                        <th>Perfil</th>
                        <th>Correo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="modales">
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Agregar Usuario</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form" novalidate>
                    <div class="modal-body p-4">
                        <input type="hidden" id="id" name="id" />
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Nombre de Usuario</label>
                            <input type="text" id="usuario" class="form-control" placeholder="Ej. juan.perez" required />
                            <div id="usuario-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo Electrónico</label>
                            <input type="email" id="correo" class="form-control" placeholder="ejemplo@lajama.com" required />
                            <div id="correo-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="mb-3">
                            <label for="id_perfil" class="form-label">Perfil / Rol</label>
                            <select id="id_perfil" class="form-select" required>
                                <option value="" disabled selected>Selecciona un Perfil</option>
                            </select>
                            <div id="id_perfil-error" class="invalid-feedback d-block"></div>
                        </div>
                        <div class="mb-3">
                            <label for="clave" class="form-label">Contraseña</label>
                            <input type="password" id="clave" class="form-control" placeholder="Mínimo 6 caracteres" />
                            <div id="clave-error" class="invalid-feedback d-block"></div>
                            <small class="text-muted d-block mt-1">Dejar en blanco si está editando y no desea cambiarla.</small>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
