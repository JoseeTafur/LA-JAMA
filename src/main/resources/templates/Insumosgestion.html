<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div id="contenido_submodulo">
    <div class="row g-4">
        <div class="col-xl-6 col-lg-6">
            <div class="card recipe-form-container h-100 border-0">
                <div class="card-body p-4 d-flex flex-column justify-content-between">
                    <form method="post" id="formAsignarMasivo"
                          th:action="@{/insumos/producto/receta/guardar-matriz}">
                        <div>
                            <div class="d-flex align-items-center mb-4">
                                <div class="p-2 rounded-3 me-3" style="background: rgba(255,255,255,0.1);">
                                    <i class="bi bi-ui-checks text-white fs-4"></i>
                                </div>
                                <div>
                                    <h5 class="fw-bold text-white mb-0">Composición de Fórmulas</h5>
                                    <small class="text-white-50">Marca los insumos y asigna sus porciones por plato</small>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label-jama text-white mb-1">
                                    <span class="recipe-step-indicator">1</span> Seleccionar Plato Destino
                                </label>
                                <select name="idProductoSelect" class="form-select-jama" id="selectProductoMatriz" required>
                                    <option value="">🔍 ¿Qué plato vamos a configurar hoy?</option>
                                    <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                </select>
                            </div>

                            <div class="mb-2 d-flex justify-content-between align-items-center">
                                <label class="form-label-jama text-white mb-0">
                                    <span class="recipe-step-indicator">2</span> Insumos y Porciones Requeridas
                                </label>
                                <input type="text" id="buscarInsumoMatriz" class="form-control form-control-sm recipe-search-box px-3 style-placeholder" style="width: 180px;" placeholder="Filtrar ingredientes...">
                            </div>

                            <div class="recipe-matrix-container pe-1">
                                <div class="matrix-group mb-3">
                                    <div class="text-white-50 small fw-bold mb-2 text-uppercase" style="font-size:0.7rem; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:2px;">🥩 Proteínas</div>
                                    <div th:each="ins : ${insumos}" th:if="${ins.categoria == 'PROTEINA' and (ins.estado == null or ins.estado == 1)}" class="recipe-matrix-item d-flex align-items-center justify-content-between">
                                        <div class="form-check form-check-jama m-0 d-flex align-items-center">
                                            <input class="form-check-input check-insumo-receta" type="checkbox" th:name="'insumosSeleccionados'" th:value="${ins.id}" th:id="'check-' + ${ins.id}">
                                            <label class="form-check-label text-white fw-semibold small ms-2" th:for="'check-' + ${ins.id}" th:text="${ins.nombre}"></label>
                                        </div>
                                        <div class="portion-input-group d-flex align-items-center gap-1">
                                            <input type="number" step="0.1" value="1.0" min="0.1" th:name="'porciones-' + ${ins.id}" class="form-control form-control-sm input-portion-jama" placeholder="1.0">
                                            <span class="text-white-50" style="font-size:0.75rem;">porc.</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="matrix-group mb-3">
                                    <div class="text-white-50 small fw-bold mb-2 text-uppercase" style="font-size:0.7rem; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:2px;">🥬 Vegetales, Salsas y Abarrotes</div>
                                    <div th:each="ins : ${insumos}" th:if="${ins.categoria != 'PROTEINA' and (ins.estado == null or ins.estado == 1)}" class="recipe-matrix-item d-flex align-items-center justify-content-between">
                                        <div class="form-check form-check-jama m-0 d-flex align-items-center">
                                            <input class="form-check-input check-insumo-receta" type="checkbox" th:name="'insumosSeleccionados'" th:value="${ins.id}" th:id="'check-' + ${ins.id}">
                                            <label class="form-check-label text-white fw-semibold small ms-2" th:for="'check-' + ${ins.id}" th:text="${ins.nombre}"></label>
                                        </div>
                                        <div class="portion-input-group d-flex align-items-center gap-1">
                                            <input type="number" step="0.1" value="1.0" min="0.1" th:name="'porciones-' + ${ins.id}" class="form-control form-control-sm input-portion-jama" placeholder="1.0">
                                            <span class="text-white-50" style="font-size:0.75rem;">porc.</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="submit" class="btn btn-light w-100 fw-bold text-dark rounded-pill py-2 border-0 shadow-sm"><i class="bi bi-cloud-check-fill me-2 text-jama-success"></i>Actualizar Receta Completa</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-xl-6 col-lg-6">
            <div class="card card-jama h-100 border-1 bg-white">
                <div class="card-body p-2">
                    <div class="d-flex justify-content-between align-items-center recipe-section-header">
                        <div class="d-flex align-items-center"><i class="bi bi-journal-richtext text-jama-green fs-4 me-2"></i><h5 class="fw-bold mb-0 text-dark">Recetarios Activos</h5></div>
                        <span class="badge bg-light text-secondary border rounded-pill px-3 py-1 font-monospace small" th:text="${#lists.size(productos)} + ' Platos registrados'">0 Platos</span>
                    </div>
                    <div class="row g-3 overflow-auto pe-1" style="max-height: 440px;">
                        <div class="col-md-6 col-sm-12" th:each="p : ${productos}">
                            <div class="recipe-active-card bg-white shadow-sm">
                                <div class="d-flex align-items-center text-truncate me-2">
                                    <div class="p-2 bg-light rounded-circle me-2 text-center flex-shrink-0" style="width:36px; height:36px; line-height:20px;"><i class="bi bi-egg-fried text-jama-gold"></i></div>
                                    <span class="recipe-dish-title text-truncate" th:text="${p.nombre}">Nombre del Plato</span>
                                </div>
                                <button type="button" class="btn btn-sm btn-jama-outline rounded-pill px-3 flex-shrink-0 btn-ver-receta" th:data-id="${p.id}" th:data-nombre="${p.nombre}"><i class="bi bi-eye-fill me-1"></i> Ver Fórmula</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
