<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Jama - Iniciar Sesión</title>
    <link rel="icon" type="image/png" th:href="@{/favicon.png}" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="login-page-container">
    <div class="bg-cursor-glow" id="bg-interactive-glow"></div>
    <div class="pattern-bg ripple-container" id="ripple-grid"></div>

    <div class="login-card-wrapper">
        <div class="login-card">
            <div class="login-grid">

                <form class="login-form" id="loginForm" th:action="@{/login}" method="POST"
                      th:data-video-src="@{/video/loader_lajama.webm}">
                    <div class="form-header">
                        <h1 class="form-title">¡Bienvenido de vuelta!</h1>
                        <p class="form-subtitle">Ingresa tus credenciales para acceder al sistema administrativo.</p>
                    </div>

                    <div class="field-group">
                        <label th:for="usuario" class="field-label">Usuario o Correo</label>
                        <div class="input-relative">
                            <input id="usuario" name="usuario" type="text" placeholder="Nombre de usuario" required autocomplete="username" autofocus />
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="label-row">
                            <label th:for="clave" class="field-label">Contraseña</label>
                            <a href="#" class="form-link">¿Olvidaste tu contraseña?</a>
                        </div>
                        <div class="input-relative">
                            <input id="clave" name="clave" type="password" placeholder="Contraseña" required autocomplete="current-password" />
                            <span class="password-toggle" id="togglePassword" style="cursor: pointer;">
                                <i class="bi bi-eye"></i>
                            </span>
                        </div>
                    </div>

                    <div class="field-group pt-2">
                        <button type="submit" class="btn-jama-submit">
                            Ingresar al Sistema <i class="bi bi-arrow-right-short"></i>
                        </button>
                    </div>
                </form>

                <div class="login-banner-side" id="banner-derecho">
                    <div class="cursor-glow" id="interactive-glow"></div>
                    <div class="banner-overlay-text">
                        <img th:src="@{/img/logo.png}" alt="Logo La Jama" class="login-logo-img">
                        <p class="logo-slogan">Sazón Casera con Alma Peruana</p>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>

<!-- 🎥 Tu overlay de carga premium intacto -->
<div id="loading-overlay" class="premium-loading-overlay">
    <video id="premium-video" loop muted playsinline preload="auto">
        <source th:src="@{/video/loader_lajama.webm}" type="video/webm">
    </video>
    <div class="loader-matrix-jama"></div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- 🛡️ Mensajes de error devueltos por el backend -->
<script th:if="${error}">
    Swal.fire({
        icon: 'error',
        title: 'Error de Acceso',
        text: '[[${error}]]',
        confirmButtonColor: '#1B3A2C'
    });
</script>

<script th:src="@{/js/main.js}"></script>

<!-- ⚡ SCRIPTS DE INTERACTIVIDAD Y ADUANA DE CLIENTE UNIFICADOS -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const inputPassword = document.querySelector("#clave");
        const toggleBtn = document.querySelector("#togglePassword");
        const loginForm = document.getElementById("loginForm");

        // A) Conmutador dinámico de visibilidad de contraseña (Ojito)
        if (toggleBtn && inputPassword) {
            toggleBtn.addEventListener("click", function () {
                const isPassword = inputPassword.getAttribute("type") === "password";
                inputPassword.setAttribute("type", isPassword ? "text" : "password");

                const icon = this.querySelector("i");
                if (icon) {
                    icon.classList.toggle("bi-eye");
                    icon.classList.toggle("bi-eye-slash");
                }
            });
        }

        // B) Aduana de validación antes del envío físico de datos
        if (loginForm) {
            loginForm.addEventListener("submit", function (e) {
                const usuario = document.getElementById("usuario").value.trim();
                const clave = document.getElementById("clave").value.trim();

                if (!usuario) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'warning',
                        title: 'Campo Requerido',
                        text: 'Por favor, ingresa tu nombre de usuario o correo electrónico.',
                        confirmButtonColor: '#1B3A2C'
                    });
                    return false;
                }

                if (!clave) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'warning',
                        title: 'Campo Requerido',
                        text: 'La contraseña de acceso es obligatoria.',
                        confirmButtonColor: '#1B3A2C'
                    });
                    return false;
                }

                if (clave.length < 4) {
                    e.preventDefault();
                    Swal.fire({
                        icon: 'error',
                        title: 'Contraseña Inválida',
                        text: 'La credencial de acceso debe contener como mínimo 4 caracteres.',
                        confirmButtonColor: '#1B3A2C'
                    });
                    return false;
                }

                // Si los datos pasan la aduana, el flujo natural ejecutará el video loader de tu main.js
            });
        }
    });
</script>
</body>
</html>
