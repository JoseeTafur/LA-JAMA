<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div id="contenido_submodulo">
    <div class="card card-color1 p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 border-bottom pb-3 mb-3">
            <h5 class="fw-bold mb-0 text-dark">Inventario General y Porciones de Proteínas</h5>
            <div class="input-group shadow-sm" style="max-width: 300px;">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="buscadorPrincipal"
                       class="form-control border-start-0 rounded-end-pill ps-0"
                       placeholder="Buscar insumo..."
                       onkeyup="filtrarTablaPrincipal()">
            </div>
        </div>

        <div class="table-responsive-jama">
            <table class="table table-jama align-middle mb-0">
                <thead>
                <tr>
                    <th class="ps-4">Insumo</th>
                    <th>Stock / Porciones</th>
                    <th>Rendimiento</th>
                    <th class="text-center pe-4">Acciones</th>
                </tr>
                </thead>
                <tbody id="cuerpoTablaPrincipal">

                <tr th:each="insumo : ${insumos}" th:if="${insumo.categoria == 'PROTEINA'}">
                    <td class="ps-4 fw-bold">
                        <span th:text="${insumo.nombre}" th:classappend="${insumo.estado == 0 ? 'text-muted text-decoration-line-through' : 'text-dark'}"></span>
                        <span class="badge bg-warning text-dark ms-2" style="font-size: 0.65rem;">PROTEÍNA</span>
                        <span th:if="${insumo.estado == 0}" class="badge bg-danger ms-1" style="font-size: 0.65rem;">INACTIVO</span>
                    </td>
                    <td>
    <span th:data-minimo="${insumo.stockMinimo != null ? insumo.stockMinimo.intValue() : 0}"
          class="badge px-2 py-1 rounded fw-bold badge-stock-dinamico"
          th:classappend="${insumo.stockActual != null and insumo.stockMinimo != null and insumo.stockActual <= insumo.stockMinimo} ? 'bg-danger text-white' : 'bg-success text-white'"
          th:text="${insumo.stockActual != null ? insumo.stockActual.intValue() : 0}">
    </span>
                        <span class="text-muted small ms-1">porciones</span>
                    </td>
                    <td>
                        <span class="fw-semibold" th:text="${insumo.porcionesPorKg} ?: '-'"></span>
                        <span class="text-muted small ms-1">por kg</span>
                    </td>
                    <td class="text-center pe-3" style="width: 1%; white-space: nowrap;">
                        <div class="d-flex align-items-center justify-content-center gap-1">
                            <button th:if="${session.rol == 'ADMIN'}" th:disabled="${insumo.estado == 0}"
                                    class="btn btn-sm btn-jama-kinetic px-2 py-1 h-auto"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" th:data-categoria="${insumo.categoria}"
                                    onclick="manejadorModalLote(this)" style="font-size: 0.8rem !important; height: 34px !important;">
                                <i class="bi bi-box-arrow-in-down"></i> <span>Lote</span>
                            </button>
                            <button th:if="${session.rol == 'COCINA' or session.rol == 'ADMIN'}" th:disabled="${insumo.estado == 0}"
                                    class="btn btn-sm btn-action-status is-active border px-2 py-1 h-auto m-0"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}"
                                    onclick="manejadorModalProduccion(this)" style="font-size: 0.8rem !important; min-height: 34px !important; height: 34px !important;">
                                <i class="bi bi-fire"></i> <span>Cocina</span>
                            </button>
                            <button th:disabled="${insumo.estado == 0}"
                                    class="btn btn-sm btn-action-edit"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}"
                                    onclick="manejadorModalAjuste(this)" style="width: 34px; height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center;">
                                <i class="bi bi-sliders text-dark"></i>
                            </button>
                            <button class="btn btn-sm btn-jama-kinetic px-2 py-1 h-auto bg-secondary border-secondary"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" th:data-categoria="${insumo.categoria}"
                                    onclick="manejadorModalKardex(this)" style="font-size: 0.8rem !important; height: 34px !important;">
                                <i class="bi bi-clock-history"></i> <span>Kardex</span>
                            </button>
                        </div>
                    </td>
                </tr>

                <tr th:each="insumo : ${insumos}" th:if="${insumo.categoria != 'PROTEINA'}">
                    <td class="ps-4 fw-semibold">
                        <span th:text="${insumo.nombre}" th:classappend="${insumo.estado == 0 ? 'text-muted text-decoration-line-through' : 'text-secondary'}"></span>
                        <span class="badge bg-light text-secondary border ms-2" style="font-size: 0.65rem;" th:text="${insumo.categoria}"></span>
                        <span th:if="${insumo.estado == 0}" class="badge bg-danger ms-1" style="font-size: 0.65rem;">INACTIVO</span>
                    </td>
                    <td>
    <span th:data-minimo="${insumo.stockMinimo != null ? insumo.stockMinimo : 0}"
          class="fw-bold badge-stock-dinamico"
          th:classappend="${insumo.stockActual != null and insumo.stockMinimo != null and insumo.stockActual <= insumo.stockMinimo} ? 'text-danger' : 'text-dark'"
          th:text="${insumo.unidadMedida == 'Und' or insumo.unidadMedida == 'Saco' or insumo.unidadMedida == 'Sacos' ? (insumo.stockActual != null ? insumo.stockActual.intValue() : 0) : (insumo.stockActual != null ? insumo.stockActual : 0)}">
    </span>
                        <span class="text-muted small ms-1" th:text="${insumo.unidadMedida == 'Und' ? 'unidades' : (insumo.unidadMedida == 'Saco' or insumo.unidadMedida == 'Sacos' ? 'sacos' : (insumo.unidadMedida == 'Gr' ? 'gramos' : (insumo.unidadMedida == 'Litro' ? 'litros' : 'kg')))}"></span>
                    </td>
                    <td><span class="text-muted small">N/A</span></td>
                    <td class="text-center pe-3" style="width: 1%; white-space: nowrap;">
                        <div class="d-flex align-items-center justify-content-center gap-1">
                            <button th:if="${session.rol == 'ADMIN'}" th:disabled="${insumo.estado == 0}"
                                    class="btn btn-sm btn-jama-kinetic px-2 py-1 h-auto"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" th:data-categoria="${insumo.categoria}"
                                    onclick="manejadorModalLote(this)" style="font-size: 0.8rem !important; height: 34px !important;">
                                <i class="bi bi-box-arrow-in-down"></i> <span>Lote</span>
                            </button>

                            <button th:disabled="${insumo.estado == 0}"
                                    class="btn btn-sm btn-action-edit"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}"
                                    onclick="manejadorModalAjuste(this)" style="width: 34px; height: 34px; min-width: 34px; display: inline-flex; align-items: center; justify-content: center;">
                                <i class="bi bi-sliders text-dark"></i>
                            </button>

                            <button class="btn btn-sm btn-jama-kinetic px-2 py-1 h-auto bg-secondary border-secondary"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" th:data-categoria="${insumo.categoria}"
                                    onclick="manejadorModalKardex(this)" style="font-size: 0.8rem !important; height: 34px !important;">
                                <i class="bi bi-clock-history"></i> <span>Kardex</span>
                            </button>
                        </div>
                    </td>
                </tr>

                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3 pt-3 border-top">
            <div id="infoRegistrosPrincipal" class="text-muted small fw-semibold">
                Mostrando registros del 0 al 0 de un total de 0 registros
            </div>

            <div class="d-flex align-items-center gap-4 flex-wrap">
                <div class="jama-length-changer">
                    <span>Mostrar</span>
                    <select id="registrosPorPaginaPrincipal" class="select-jama-pages" onchange="cambiarLimiteFilasPrincipal()">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span>registros</span>
                </div>
                <ul id="paginadorPrincipal" class="jama-pagination-wrapper">
                </ul>
            </div>
        </div>

    </div>
</div>

</body>
</html>
