<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(
          title='La Jama - Nueva Comanda',
          content=~{::#contenido-comanda},
          modals=~{::#modales-comanda},
          js='/js/mesero.js'
      )}">
<head>
    <style th:if="${param.embed != null and param.embed[0] == 'true'}">
        /* Reglas de aislamiento ultrarrápido si se visualiza empotrado en un monitor */
        .sidebar, #sidebar, .main-content header, .header-jama { display: none !important; }
        .main-content { margin-left: 0 !important; padding: 8px !important; width: 100% !important; }
    </style>
</head>
<body>

<div id="contenido-comanda" class="jama-mesero-container">
    <link rel="stylesheet" th:href="@{/css/mesero.css}">

    <div class="comanda-wrapper">

        <div class="productos-seccion">
            <div class="search-box-jama-wrapper">
                <form class="form-busqueda-jama" onsubmit="event.preventDefault();">
                    <button type="button" class="btn-buscar-trigger">
                        <svg width="17" height="16" fill="none" xmlns="http://www.w3.org/2000/svg" role="img">
                            <path d="M7.667 12.667A5.333 5.333 0 107.667 2a5.333 5.333 0 000 10.667zM14.334 14l-2.9-2.9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </button>
                    <input class="input-busqueda-jama" id="buscador" placeholder="Buscar plato o bebida..." required="" type="text" onkeyup="filtrarProductos()">
                    <button class="reset-buscar-jama" type="button" onclick="limpiarBuscadorCarta()">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </form>
            </div>

            <div class="grid-productos-premium" id="grid-productos">
                <div th:each="prod : ${productos}"
                     th:with="agotado=${productosAgotados.get(prod.id)}"
                     class="producto-card-wrapper">

                    <div class="menu-item-premium"
                         th:classappend="${agotado} ? 'item-agotado' : ''"
                         th:data-id="${prod.id}"
                         th:data-nombre="${prod.nombre}"
                         th:data-precio="${prod.precio}"
                         th:onclick="${agotado} ? 'notificarAgotado()' : 'abrirModalInsumos(this)'">

                        <div th:if="${agotado}" class="overlay-agotado">
                            <span class="badge-agotado-tag">Agotado</span>
                        </div>

                        <div class="img-container">
                            <img th:src="${prod.imagen != null and prod.imagen != '' ? prod.imagen : 'https://placehold.co/400x300?text=La+Jama'}" alt="Plato">
                        </div>

                        <div class="item-details">
                            <div class="category-row mb-1">
                                <span class="category-pill" th:text="${prod.categoria.nombre}"></span>
                            </div>
                            <h6 class="product-title" th:text="${prod.nombre}"></h6>
                            <div class="price-row mt-2">
                                <span class="price-tag">S/ [[${#numbers.formatDecimal(prod.precio, 1, 2)}]]</span>
                                <div class="plus-action-btn" th:if="${!agotado}">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <input type="checkbox" id="toggle-carrito-movil" class="checkbox-toggle-hidden">

        <div class="carrito-sidebar-premium">
            <label for="toggle-carrito-movil" class="carrito-mobile-trigger">
                <div class="trigger-info">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>Ver Comanda Activa</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="arrow-icon"><polyline points="18 15 12 9 6 15"/></svg>
            </label>

            <div class="carrito-inner-content">
                <div class="carrito-header">
                    <h5 class="carrito-titulo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="color: var(--lajama-green);"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                        Detalle de Orden
                    </h5>
                    <label for="toggle-carrito-movil" class="btn-close-carrito-movil">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </label>
                </div>

                <div class="carrito-inputs-group">
                    <div class="form-floating-custom">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="4" y1="9" x2="20" y2="9"/><line x1="4" y1="15" x2="20" y2="15"/><line x1="10" y1="3" x2="8" y2="21"/><line x1="16" y1="3" x2="14" y2="21"/></svg>
                        <input type="text" id="cliente" placeholder="Mesa" readonly>
                    </div>
                    <div class="form-floating-custom">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        <input type="text" id="direccion" placeholder="Instrucciones de cocina...">
                    </div>
                </div>

                <div id="lista-items" class="lista-items-scroll"></div>

                <div class="carrito-footer">
                    <div class="total-row">
                        <span class="total-label">Total a enviar:</span>
                        <span class="total-amount">S/ <span id="total-monto">0.00</span></span>
                    </div>
                    <button class="send-cocina-btn" onclick="enviarPedido()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3.5z"/></svg>
                        ENVIAR A COCINA
                    </button>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="modales-comanda">
    <div class="modal fade" id="modalInsumos" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="modal-header text-white p-3 border-0" style="background-color: var(--lajama-green) !important;">
                    <h6 class="modal-title fw-bold" id="modalNombrePlato">Personalizar Plato</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <p class="text-muted small mb-3">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-success me-1"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        Desmarca los insumos que el cliente <b>NO</b> desea:
                    </p>
                    <div id="listaInsumosModal" class="mb-0 d-flex flex-column gap-2"></div>
                </div>
                <div class="modal-footer bg-light border-0 p-3 gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-sm text-white rounded-pill px-4 fw-bold" style="background-color: var(--lajama-green) !important;" onclick="confirmarAgregarAlCarrito()">Aceptar</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const mesaId = urlParams.get('mesaId');
        if (mesaId) {
            document.getElementById('cliente').value = 'Mesa #' + mesaId;
        }
        if (urlParams.get('embed') === 'true') {
            const mc = document.getElementById('main-content') || document.querySelector('.main-content');
            if (mc) { mc.style.marginLeft = "0px"; mc.style.padding = "8px"; }
        }
    });
    function notificarAgotado() {
        if(window.AppUtils) {
            AppUtils.showNotification('Plato agotado. No hay suficientes porciones.', 'error');
        } else {
            alert('Plato agotado. No hay suficientes porciones.');
        }
    }
</script>
</body>
</html>
