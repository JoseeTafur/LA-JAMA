<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(
          title='Monitor de Cocina - Estación Fría - La Jama',
          activeUri='/admin/cocina/fria',
          titleHeader='Monitoreo Fría',
          content=~{::#contenido-cocina},
          modals=~{},
          js='/js/cocina-fria.js'
      )}">
<head>
</head>
<body>

<div id="contenido-cocina" class="container-fluid p-0">
    <link rel="stylesheet" th:href="@{/css/cocina-core.css}">
    <link rel="stylesheet" th:href="@{/css/cocina-fria.css}">

    <div class="pedidos-grid-header px-4 mt-3 d-flex justify-content-end">
        <div class="status-badge-jama px-3 py-2 rounded-pill shadow-sm">
            <i class="bi bi-snow me-2"></i> ORDENES PENDIENTES: <span th:text="${#lists.size(pedidos)}">0</span>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(pedidos)}" class="text-center py-5 mt-5 text-muted animate__animated animate__fadeIn">
        <i class="bi bi-clipboard2-check-fill text-info" style="font-size: 5rem; opacity: 0.8;"></i>
        <h3 class="mt-3 fw-bold text-dark">No hay pedidos recientes</h3>
        <p class="fs-5 text-muted">La barra fría está totalmente al día. ¡Excelente trabajo!</p>
    </div>

    <div th:unless="${#lists.isEmpty(pedidos)}" class="pedidos-grid">
        <div th:each="p : ${pedidos}"
             class="card-pedido"
             th:id="'pedido-' + ${p.id}"
             th:with="detallesFrios=${p.getListaDetalles().?[producto != null && producto.categoria != null && (#strings.contains(#strings.toUpperCase(producto.categoria.nombre), 'FRÍ') || #strings.contains(#strings.toUpperCase(producto.categoria.nombre), 'FRI')) && !cocinado]},
                      platosActivosFrios=${detallesFrios.?[!canceladoPorCliente]}"
             th:style="${#lists.isEmpty(platosActivosFrios)} ? 'display: none;' : ''">

            <div class="card-header">
                <span class="badge-id">ORD. #[[${p.id}]]</span>
                <div class="timer-container" th:data-start="${p.fechaCreacion}">
                    <i class="bi bi-stopwatch me-1"></i>
                    <span class="timer-display">00:00</span>
                </div>
            </div>

            <div class="card-body">
                <h5 class="cliente-nombre" th:if="${p.numeroMesa != null}">
                    Mesa: <span th:text="${p.numeroMesa}"></span>
                </h5>
                <h5 class="cliente-nombre" th:unless="${p.numeroMesa != null}" style="color: #0284c7 !important;">
                    Cliente: <span th:text="${p.cliente}"></span>
                </h5>

                <div th:if="${p.direccion != null and !p.direccion.isEmpty()}">
                    <small style="color: #0dcaf0; font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.85rem;">
                        [[${p.direccion}]]
                    </small>
                </div>

                <div class="items-lista">
                    <div class="item-plato p-2 mb-1 rounded animate__animated animate__fadeIn"
                         th:each="d : ${p.getListaDetalles()}"
                         th:if="${d.producto != null && d.producto.categoria != null && (#strings.contains(#strings.toUpperCase(d.producto.categoria.nombre), 'FRÍ') || #strings.contains(#strings.toUpperCase(d.producto.categoria.nombre), 'FRI')) && !d.cocinado}"
                         th:style="${d.canceladoPorCliente} ? 'background-color: #ffe5e5; border-left: 5px solid #dc3545 !important; opacity: 0.85;' : (!d.impresoEnCocina ? 'background-color: rgba(13, 202, 240, 0.15); border-left: 3px solid #0dcaf0;' : 'border-left: 3px solid transparent;')">

                        <div class="d-flex align-items-center justify-content-between w-100">
                            <div class="d-flex align-items-center">
                                <span class="item-cantidad" th:classappend="${d.canceladoPorCliente} ? 'bg-danger text-white border-danger' : 'text-info border-info'" th:text="${d.cantidad}">1</span>

                                <span class="item-nombre fw-bold"
                                      th:classappend="${d.canceladoPorCliente} ? 'text-danger text-decoration-line-through' : 'text-dark'"
                                      th:text="${d.producto.nombre}">Plato Frío</span>
                            </div>

                            <div class="d-flex align-items-center gap-2">
                                <span th:if="${!d.impresoEnCocina && !d.canceladoPorCliente}"
                                      class="badge bg-info text-dark shadow-sm animate__animated animate__pulse animate__infinite">
                                    <i class="bi bi-star-fill me-1"></i>NUEVO
                                </span>

                                <span th:if="${d.canceladoPorCliente}"
                                      class="badge bg-danger text-white shadow-sm fw-bold px-2 py-1">
                                    <i class="bi bi-exclamation-octagon-fill me-1"></i>MERMA
                                </span>

                                <button th:if="${!d.canceladoPorCliente && d.impresoEnCocina}"
                                        type="button"
                                        class="btn btn-sm btn-outline-info text-dark border-info"
                                        th:onclick="despacharItemCocina([[${p.id}]], [[${d.id}]], '[[${d.producto.nombre}]]', this)"
                                        title="Despachar a salón"
                                        style="padding: 2px 8px; font-weight: bold;">
                                    <i class="bi bi-check2-all"></i> Despachar
                                </button>

                                <button th:if="${!d.canceladoPorCliente && !d.impresoEnCocina}"
                                        type="button"
                                        class="btn btn-sm btn-light border text-muted opacity-50"
                                        disabled
                                        title="¡Acción bloqueada! Primero debes imprimir el ticket."
                                        style="padding: 2px 8px; cursor: not-allowed;">
                                    <i class="bi bi-lock-fill"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card-footer" th:with="nuevosFrios=${p.getListaDetalles().?[!canceladoPorCliente && !impresoEnCocina && producto != null && producto.categoria != null && (producto.categoria.nombre.toUpperCase().contains('FRI') || producto.categoria.nombre.toUpperCase().contains('FRÍ'))]}">
                <div class="footer-actions d-flex gap-2 w-100">
                    <a th:href="@{'/admin/cocina/ticket/' + ${p.id} + '/fria'}" target="_blank"
                       class="btn w-100 fw-bold d-flex align-items-center justify-content-center"
                       th:classappend="${#lists.isEmpty(nuevosFrios)} ? 'btn-secondary text-white' : 'btn-info btn-alerta-ticket text-dark'">
                        <i class="bi bi-printer me-2"></i> [[${#lists.isEmpty(nuevosFrios)} ? 'Reimprimir' : 'Imprimir Ticket']]
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
