<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(title='Gestión de Reservas', content=~{::#contenido}, modals=~{::#modales}, js='/js/reservas.js')}">
<body>

<div id="contenido">
    <link rel="stylesheet" th:href="@{/css/reservas.css}">

    <div class="card-jama-main">
        <div class="tablero-header">
            <h1 class="tablero-title">
                <i class="bi bi-calendar3 icon-accent"></i> Libro de Reservas
            </h1>
            <button type="button" id="btnNuevoRegistro" class="btn-jama-kinetic">
                <i class="bi bi-calendar-plus"></i>
                <span>Nuevo Registro</span>
            </button>
        </div>

        <div class="table-container-fluid">
            <table id="tablaReservas" class="table-jama">
                <thead>
                <tr>
                    <th style="width: 5%;">ID</th>
                    <th style="width: 20%;">Cliente</th>
                    <th style="width: 10%;">Teléfono</th>
                    <th style="width: 8%;">Personas</th>
                    <th style="width: 15%;">Mesas Estimadas</th>
                    <th style="width: 15%;">Fecha y Hora</th>
                    <th style="width: 10%;">Estado</th>
                    <th style="width: 12%;">Observación</th>
                    <th class="text-center" style="width: 15%;">Acciones</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modales">

    <div class="jama-modal-overlay" id="modalReserva" hidden>
        <div class="jama-modal-content animate__animated animate__fadeInUp">
            <div class="jama-modal-header">
                <h5 class="jama-modal-title">
                    <i class="bi bi-calendar-check-fill icon-accent"></i> Agregar Reserva
                </h5>
                <button type="button" class="jama-close-btn" onclick="window.cerrarCapaModal('modalReserva')">&times;</button>
            </div>

            <form id="form" name="formReserva" novalidate>
                <div class="jama-grid-layout">
                    <div class="jama-form-group span-6">
                        <label for="rNombre" class="jama-label">Nombre del Cliente</label>
                        <input type="text" id="rNombre" name="nombreCliente" class="jama-input" placeholder="Solo letras" maxlength="30" required />
                        <div id="rNombre-error" class="invalid-feedback"></div>
                    </div>

                    <div class="jama-form-group span-6">
                        <label for="rTelefono" class="jama-label">Teléfono de Contacto</label>
                        <input type="text" id="rTelefono" name="telefono" class="jama-input" placeholder="9 dígitos" maxlength="9" required />
                        <div id="rTelefono-error" class="invalid-feedback"></div>
                    </div>

                    <div class="jama-form-group span-4">
                        <label for="rPersonas" class="jama-label">N° de Personas</label>
                        <input type="number" id="rPersonas" name="numeroPersonas" class="jama-input" min="1" max="50" placeholder="Ej: 6" required />
                        <div id="rPersonas-error" class="invalid-feedback"></div>
                    </div>

                    <div class="jama-form-group span-4">
                        <label for="rFecha" class="jama-label">Fecha del Evento</label>
                        <input type="date" id="rFecha" name="fecha" class="jama-input input-fecha-reserva" required />
                        <div id="rFecha-error" class="invalid-feedback"></div>
                    </div>

                    <div class="jama-form-group span-4">
                        <label for="rHora" class="jama-label">Hora Pactada</label>
                        <input type="time" id="rHora" name="hora" class="jama-input" required />
                        <div id="rHora-error" class="invalid-feedback"></div>
                    </div>

                    <div class="jama-form-group span-12">
                        <label for="rObservacion" class="jama-label">Observación de Servicio (Opcional)</label>
                        <textarea id="rObservacion" name="observacion" class="jama-textarea" rows="2" maxlength="150" placeholder="Alergias, preferencias, ocasión especial..."></textarea>
                    </div>
                </div>

                <div id="mesasInfo" class="jama-info-box" style="display: none;">
                    <small id="mesasInfoTexto"></small>
                </div>

                <div class="jama-modal-actions">
                    <button type="button" class="btn-jama-secondary" onclick="window.cerrarCapaModal('modalReserva')">Cancelar</button>
                    <button type="submit" class="btn-jama-primary" id="btnGuardarReserva">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>

    <div class="jama-modal-overlay" id="modalEditarReserva" hidden>
        <div class="jama-modal-content animate__animated animate__fadeInUp">
            <div class="jama-modal-header">
                <h5 class="jama-modal-title">
                    <i class="bi bi-pencil-square icon-accent"></i> Modificar Datos de Reserva
                </h5>
                <button type="button" class="jama-close-btn" onclick="window.cerrarCapaModal('modalEditarReserva')">&times;</button>
            </div>

            <div class="jama-grid-layout">
                <input type="hidden" id="eReservaId" />

                <div class="jama-form-group span-6">
                    <label for="eNombre" class="jama-label">Nombre del Cliente</label>
                    <input type="text" id="eNombre" class="jama-input" maxlength="30" data-no-validation />
                    <div id="eNombre-error" class="invalid-feedback"></div>
                </div>

                <div class="jama-form-group span-6">
                    <label for="eTelefono" class="jama-label">Teléfono</label>
                    <input type="text" id="eTelefono" class="jama-input" maxlength="9" data-no-validation />
                    <div id="eTelefono-error" class="invalid-feedback"></div>
                </div>

                <div class="jama-form-group span-4">
                    <label for="ePersonas" class="jama-label">N° de Personas</label>
                    <input type="number" id="ePersonas" class="jama-input" min="1" max="50" data-no-validation />
                    <div id="ePersonas-error" class="invalid-feedback"></div>
                </div>

                <div class="jama-form-group span-4">
                    <label for="eFecha" class="jama-label">Fecha</label>
                    <input type="date" id="eFecha" class="jama-input input-fecha-reserva" />
                    <div id="eFecha-error" class="invalid-feedback"></div>
                </div>

                <div class="jama-form-group span-4">
                    <label for="eHora" class="jama-label">Hora</label>
                    <input type="time" id="eHora" class="jama-input" data-no-validation />
                    <div id="eHora-error" class="invalid-feedback"></div>
                </div>

                <div class="jama-form-group span-12">
                    <label for="eObservacion" class="jama-label">Observación</label>
                    <textarea id="eObservacion" class="jama-textarea" rows="2" maxlength="150"></textarea>
                </div>
            </div>

            <div class="jama-modal-actions">
                <button type="button" class="btn-jama-secondary" onclick="window.cerrarCapaModal('modalEditarReserva')">Cancelar</button>
                <button type="button" class="btn-jama-primary" id="btnGuardarEdicion">Guardar Cambios</button>
            </div>
        </div>
    </div>

</div>

<script th:src="@{/js/reservas/tabla.js}"></script>
<script th:src="@{/js/reservas/acciones.js}"></script>
</body>
</html>
