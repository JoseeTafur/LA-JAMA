<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="modales">

    <div class="modal fade" id="modalNuevoInsumo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-jama">
                <div class="modal-header modal-header-jama">
                    <h5 class="modal-title fw-bold text-white"><i class="bi bi-plus-circle me-2"></i>Nuevo Insumo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/insumos/guardar}" method="post" id="formNuevoInsumo">
                    <input type="hidden" name="originTab" th:value="${activeTab}" />
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" >Nombre</label>
                            <input type="text" name="nombre" class="form-control rounded-3" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoría</label>
                            <select name="categoria" id="editInsumoCategoria" class="form-select rounded-3" required>
                                <option value="PROTEINA">Proteína</option>
                                <option value="VERDURA">Verdura</option>
                                <option value="CONDIMENTO">Condimento</option>
                                <option value="BEBIDA">Bebida</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Unidad de Medida</label>
                            <select name="unidadMedida" id="selectUnidad" class="form-select rounded-3" required>
                                <option value="">Selecciona...</option>
                                <option value="Kg">Kg</option>
                                <option value="Gr">Gr</option>
                                <option value="Lt">Lt</option>
                                <option value="Ml">Ml</option>
                                <option value="Und">Und</option>
                            </select>
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Stock Mínimo</label>
                                <input type="number" step="1" id="nuevoInsumoStockMinimo" name="stockMinimo" class="form-control rounded-3" value="0" placeholder="Ej: 5"/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-jama rounded-pill px-4 fw-bold"><i class="bi bi-check-lg me-1"></i> Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalEditarInsumo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-jama">
                <div class="modal-header modal-header-jama bg-primary">
                    <h5 class="modal-title fw-bold text-white"><i class="bi bi-pencil me-2"></i>Editar Insumo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/insumos/guardar}" method="post" id="formEditarInsumo">
                    <div class="modal-body p-4">
                        <input type="hidden" name="id" id="editInsumoId"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input type="text" name="nombre" id="editInsumoNombre" placeholder="Ej: Pollo" class="form-control rounded-3" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Categoría</label>
                            <select id="editarCategoria" name="categoria" class="form-select rounded-3" required>
                                <option value="PROTEINA">Proteína</option>
                                <option value="VERDURA">Verdura</option>
                                <option value="CONDIMENTO">Condimento</option>
                                <option value="BEBIDA">Bebida</option>
                                <option value="OTRO">Otro</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Unidad de Medida</label>
                            <select name="unidadMedida" id="editInsumoUnidad" class="form-select rounded-3" required>
                                <option value="Kg">Kg</option>
                                <option value="Gr">Gr</option>
                                <option value="Lt">Lt</option>
                                <option value="Ml">Ml</option>
                                <option value="Und">Und</option>
                            </select>
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label fw-semibold">Stock Mínimo</label>
                                <input type="number" step="1" name="stockMinimo" id="editInsumoStockMinimo" class="form-control rounded-3" required/>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold"><i class="bi bi-hdd me-1"></i> Actualizar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDetalleReceta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-jama">
                <div class="modal-header modal-header-jama">
                    <h5 class="modal-title fw-bold text-white" id="tituloModalReceta"></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="thead-jama small">
                        <tr>
                            <th class="ps-3">Insumo</th>
                            <th>Unidad</th>
                            <th class="text-end">Cantidad</th>
                            <th class="text-center pe-3">Quitar</th>
                        </tr>
                        </thead>
                        <tbody id="cuerpoDetalleReceta" class="small"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalLote" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: #ffffff;">
                <div class="modal-header modal-header-success">
                    <h5 class="modal-title fw-bold text-white">
                        <i class="bi bi-box-arrow-in-down me-2"></i>Registrar Lote — <span id="loteNombreInsumo"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="loteIdInsumo"/>
                    <input type="hidden" id="loteCategoriaInsumo"/>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Kg Comprados <span class="text-danger">*</span></label>
                        <input type="number" step="0.01" id="loteKg" class="form-control rounded-3" placeholder="Ej: 10"/>
                    </div>
                    <div class="mb-3" id="contenedorPorcionesLote">
                        <label class="form-label fw-semibold">Porciones Esperadas por Kg <span class="text-danger">*</span></label>
                        <input type="number" step="0.1" id="lotePorcionesPorKg" class="form-control rounded-3" placeholder="Ej: 5.5"/>
                        <small class="text-muted text-wrap d-block">Según tu experiencia, ¿cuántas porciones obtienes por kg?</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Costo Total <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light text-muted">S/.</span>
                            <input type="number" step="0.01" id="loteCosto" class="form-control rounded-end-3" placeholder="0.00"/>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Observación <span class="text-muted fw-normal">(opcional)</span></label>
                        <input type="text" id="loteObservacion" class="form-control rounded-3" placeholder="Ej: Compra en Mercado Central"/>
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-jama-success rounded-pill px-4 fw-bold" onclick="guardarLote()">
                        <i class="bi bi-check-lg me-1"></i> Registrar Lote
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalProduccion" data-bs-backdrop="static" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg" style="background-color: #ffffff;">
                <div class="modal-header modal-header-jama bg-dark text-white">
                    <h5 class="modal-title fw-bold">
                        <i class="bi bi-fire me-2 text-warning"></i>Procesar Producción — <span id="prodNombreInsumo"></span>
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="formProduccionCocina" onsubmit="guardarProduccion(event);">
                    <div class="modal-body p-4 text-dark">
                        <input type="hidden" id="prodIdInsumo"/>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Seleccionar Lote Disponible <span class="text-danger">*</span></label>
                            <select id="prodSelectLote" class="form-select rounded-3" onchange="actualizarPorcionesEsperadas()">
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Kg a Procesar de este Lote <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" id="prodKg" class="form-control rounded-3" placeholder="Cargando máximo..." onkeyup="calcularMerma()" onchange="calcularMerma()"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Porciones Reales Obtenidas <span class="text-danger">*</span></label>
                            <input type="number" step="1" id="prodObtenidas" class="form-control rounded-3" placeholder="Ej: 18" onkeyup="calcularMerma()" onchange="calcularMerma()"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Merma Pesada en Balanza (Kg) <span class="text-danger">*</span></label>
                            <input type="number" step="0.001" id="prodMerma" class="form-control rounded-3" placeholder="Ej: 0.250" onkeyup="calcularMerma()" onchange="calcularMerma()"/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Observación de Tanda <span class="text-muted fw-normal">(opcional)</span></label>
                            <input type="text" id="prodObservacion" class="form-control rounded-3" placeholder="Ej: Merma alta por exceso de grasa en corte"/>
                        </div>

                        <div id="resumenMerma" class="mt-3 p-3 rounded-3 d-none">
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-dark rounded-pill px-4 fw-bold">
                            <i class="bi bi-play-fill me-1 text-warning"></i> Confirmar Producción
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalAjuste" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content modal-jama">
                <div class="modal-header modal-header-secondary">
                    <h5 class="modal-title fw-bold text-white"><i class="bi bi-sliders me-2"></i>Ajuste — <span id="ajusteNombreInsumo"></span></h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <input type="hidden" id="ajusteIdInsumo"/>
                    <input type="hidden" id="ajusteTipo"/>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tipo</label>
                        <div class="d-flex gap-2">
                            <button type="button" id="btnIngreso" class="btn btn-outline-success flex-fill rounded-3 fw-bold" onclick="seleccionarTipoAjuste('INGRESO')"><i class="bi bi-plus-lg me-1"></i> Ingreso</button>
                            <button type="button" id="btnEgreso" class="btn btn-outline-danger flex-fill rounded-3 fw-bold" onclick="seleccionarTipoAjuste('EGRESO')"><i class="bi bi-dash-lg me-1"></i> Egreso</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Cantidad de Porciones</label>
                        <input type="number" id="ajusteCantidad" class="form-control rounded-3" placeholder="Ej: 3" min="1"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Motivo</label>
                        <input type="text" id="ajusteMotivo" class="form-control rounded-3" placeholder="Ej: Sobró de turno anterior"/>
                    </div>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-jama-secondary rounded-pill px-4 fw-bold" onclick="guardarAjuste()"><i class="bi bi-check-lg me-1"></i> Confirmar</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalKardexPorciones" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 class="modal-title" id="tituloKardexPorciones">
                        <i class="bi bi-clock-history me-2"></i> Kardex de Insumos
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body bg-white">

                    <div class="row g-3 mb-4 p-3 rounded-3 align-items-end" style="background-color: var(--lajama-cream); border: 1px dashed rgba(27,58,44,0.12);">
                        <div class="col-md-4">
                            <label class="form-label small fw-bold">Buscar por texto</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                                <input type="text" id="searchKardexTexto" class="form-control border-start-0" placeholder="Ej: Venta, Ajuste, Código..." onkeyup="ejecutarFiltroCombinadoKardex()">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Fecha Inicio</label>
                            <input type="date" id="searchKardexFechaInicio" class="form-control form-control-sm">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Fecha Fin</label>
                            <input type="date" id="searchKardexFechaFin" class="form-control form-control-sm">
                        </div>
                        <div class="col-md-2 d-grid">
                            <button type="button" class="btn btn-sm btn-outline-danger h-auto py-2 fw-bold" onclick="invertirFlujoActualKardex()">
                                <i class="bi bi-arrow-down-up me-1"></i> Invertir
                            </button>
                        </div>
                    </div>

                    <div class="d-flex flex-wrap gap-2 mb-3">
                        <button type="button" class="btn btn-sm btn-filtro active btn-dark" data-filtro="TODOS" onclick="filtrarKardex('TODOS')">Todos</button>
                        <button type="button" class="btn btn-sm btn-filtro btn-outline-secondary" data-filtro="LOTE" onclick="filtrarKardex('LOTE')">🛒 Lotes</button>
                        <button type="button" class="btn btn-sm btn-filtro btn-outline-secondary" data-filtro="PRODUCCION" onclick="filtrarKardex('PRODUCCION')">🔥 Producción</button>
                        <button type="button" class="btn btn-sm btn-filtro btn-outline-secondary" data-filtro="AJUSTE" onclick="filtrarKardex('AJUSTE')">⚙️ Ajustes</button>
                        <button type="button" class="btn btn-sm btn-filtro btn-outline-secondary" data-filtro="VENTA" onclick="filtrarKardex('VENTA')">📦 Ventas</button>
                    </div>

                    <div class="table-responsive" style="max-height: 450px;">
                        <table class="table table-jama align-middle mb-0" id="tablaKardexModal">
                            <thead>
                            <tr id="cabeceraKardexDinamica">
                            </tr>
                            </thead>
                            <tbody id="cuerpoKardexPorciones">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="modal-footer bg-light p-2" id="nav-paginador-kardex">
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
