<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Insumos - La Jama</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
    <link rel="stylesheet" th:href="@{/css/insumos.css}">
</head>
<body class="bg-light">
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri='/insumos')}"></div>

    <main id="main-content" class="main-content">
        <div th:replace="~{sidebar :: logistica_header('Gestión de Inventario y Recetas')}"></div>

        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h4 class="fw-bold text-dark mb-0">Control de Almacén</h4>
                    <p class="text-muted mb-0">Gestiona tus proteínas controladas y tus insumos generales</p>
                </div>
                <button th:if="${session.rol == 'ADMIN'}" class="btn btn-jama rounded-pill px-4 shadow-sm" onclick="abrirModalNuevoInsumo()">
                    <i class="bi bi-plus-circle me-2"></i> Nuevo Insumo
                </button>
            </div>

            <ul class="nav nav-tabs-jama mb-4" id="inventoryTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link-jama active" id="proteinas-tab" data-bs-toggle="tab" data-bs-target="#proteinas" type="button" role="tab">
                        <i class="bi bi-heptagon-half me-2"></i>Proteínas y Porciones
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link-jama" id="almacen-tab" data-bs-toggle="tab" data-bs-target="#almacen" type="button" role="tab">
                        <i class="bi bi-box-seam me-2"></i>Otros Insumos y Recetarios
                    </button>
                </li>
            </ul>

            <div class="tab-content" id="inventoryTabsContent">
                <div class="tab-pane fade show active" id="proteinas" role="tabpanel">
                    <div class="card-jama">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="thead-jama">
                                <tr>
                                    <th class="ps-4">Proteína</th>
                                    <th>Porciones Disponibles</th>
                                    <th>Porc. Esperadas / Kg</th>
                                    <th class="text-center pe-4">Acciones</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="insumo : ${insumos}" th:if="${insumo.categoria == 'PROTEINA'}">
                                    <td class="ps-4 fw-bold" th:text="${insumo.nombre}"></td>
                                    <td>
                                        <span class="badge-porciones" th:text="${insumo.stockActual != null ? insumo.stockActual.intValue() : 0}"></span>
                                        <span class="text-muted small ms-1">porciones</span>
                                    </td>
                                    <td>
                                        <span class="fw-semibold" th:text="${insumo.porcionesPorKg} ?: '-'"></span>
                                        <span class="text-muted small ms-1">por kg</span>
                                    </td>
                                    <td class="text-center pe-4">
                                        <div class="d-flex gap-2 justify-content-center flex-wrap">
                                            <button th:if="${session.rol == 'ADMIN'}" class="btn btn-jama-success btn-sm rounded-pill btn-accion-lote"
                                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" onclick="manejadorModalLote(this)">
                                                <i class="bi bi-box-arrow-in-down me-1"></i> Registrar Lote
                                            </button>
                                            <button th:if="${session.rol == 'COCINA' or session.rol == 'ADMIN'}" class="btn btn-jama-warning btn-sm rounded-pill btn-accion-produccion"
                                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" onclick="manejadorModalProduccion(this)">
                                                <i class="bi bi-fire me-1"></i> Registrar Producción
                                            </button>
                                            <button class="btn btn-jama-secondary btn-sm rounded-pill btn-accion-ajuste"
                                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" onclick="manejadorModalAjuste(this)">
                                                <i class="bi bi-sliders me-1"></i> Ajustar
                                            </button>
                                            <button class="btn btn-jama-outline btn-sm rounded-pill btn-accion-kardex"
                                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" onclick="manejadorModalKardex(this)">
                                                <i class="bi bi-clock-history me-1"></i> Kardex
                                            </button>
                                        </div>
                                    </td>
                                </tr> </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="almacen" role="tabpanel">
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="card-jama mb-4">
                                <div class="card-jama-header">
                                    <h5 class="fw-bold mb-0">Catálogo de Insumos Generales</h5>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="thead-jama">
                                        <tr>
                                            <th class="ps-4">Insumo</th>
                                            <th>Categoría</th>
                                            <th>Und. Medida</th>
                                            <th>Stock Actual</th>
                                            <th>Stock Mínimo</th>
                                            <th th:if="${session.rol == 'ADMIN'}" class="text-center pe-4">Acciones</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="insumo : ${insumos}" th:if="${insumo.categoria != 'PROTEINA'}">
                                            <td class="ps-4 fw-semibold text-dark" th:text="${insumo.nombre}"></td>
                                            <td><span class="badge bg-light text-secondary border px-2 py-1 rounded-pill small" th:text="${insumo.categoria}"></span></td>
                                            <td class="text-muted" th:text="${insumo.unidadMedida}"></td>
                                            <td>
                                                <span th:class="${insumo.stockActual <= insumo.stockMinimo} ? 'fw-bold text-danger' : 'text-dark'" th:text="${insumo.stockActual}"></span>
                                            </td>
                                            <td class="text-muted" th:text="${insumo.stockMinimo}"></td>
                                            <td th:if="${session.rol == 'ADMIN'}" class="text-center pe-4">
                                                <div class="btn-group shadow-sm rounded-3">
                                                    <button type="button" class="btn btn-sm btn-light text-primary border btn-accion-editar"
                                                            th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}" th:data-categoria="${insumo.categoria}"
                                                            th:data-unidad="${insumo.unidadMedida}" th:data-actual="${insumo.stockActual}" th:data-minimo="${insumo.stockMinimo}"
                                                            onclick="manejadorModalEditar(this)">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button type="button" class="btn btn-sm btn-light text-danger border" th:data-id="${insumo.id}" onclick="confirmarEliminacion(this.getAttribute('data-id'))">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                                <form th:action="@{/insumos/eliminar/{id}(id=${insumo.id})}" method="post" th:id="'form-eliminar-' + ${insumo.id}" class="d-none"></form>
                                            </td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4" th:if="${session.rol == 'ADMIN'}">
                            <div class="card-jama card-jama-green mb-4">
                                <div class="card-body p-4">
                                    <h6 class="fw-bold mb-3 text-white"><i class="bi bi-link-45deg me-2"></i>Armar Receta</h6>
                                    <form method="post" id="formAsignar" th:action="@{/insumos/producto/0/agregar}">
                                        <div class="mb-3">
                                            <select name="idProductoSelect" class="form-select form-select-sm rounded-3" id="selectProducto" onchange="actualizarAccion(this.value)">
                                                <option value="">Selecciona un plato...</option>
                                                <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <select name="idInsumo" class="form-select form-select-sm rounded-3">
                                                <option value="">Selecciona el insumo...</option>
                                                <option th:each="ins : ${insumos}" th:if="${ins.categoria != 'PROTEINA'}" th:value="${ins.id}" th:text="${ins.nombre + ' (' + ins.unidadMedida + ')'}"></option>
                                            </select>
                                        </div>
                                        <div class="mb-3">
                                            <input type="number" step="0.01" name="cantidad" class="form-control form-control-sm rounded-3" placeholder="Cantidad requerida (Ej: 0.2)"/>
                                        </div>
                                        <button type="submit" class="btn btn-light btn-sm w-100 fw-bold text-dark rounded-pill">Asignar a Plato</button>
                                    </form>
                                </div>
                            </div>

                            <div class="card-jama mb-4">
                                <div class="card-body p-3">
                                    <h6 class="fw-bold mb-3 text-dark border-bottom pb-2">Recetarios Activos</h6>
                                    <ul class="list-group list-group-flush">
                                        <li class="list-group-item d-flex justify-content-between align-items-center px-0" th:each="p : ${productos}">
                                            <span class="fw-semibold text-secondary small" th:text="${p.nombre}"></span>
                                            <button type="button" class="btn btn-sm btn-jama-outline rounded-pill py-0 px-2 btn-ver-receta" th:data-id="${p.id}" th:data-nombre="${p.nombre}"><i class="bi bi-eye"></i> Ver</button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{modales_insumos :: modales}"></th:block>

<script>
    function manejadorModalLote(btn) { abrirModalLote(btn.getAttribute('data-id'), btn.getAttribute('data-nombre')); }
    function manejadorModalProduccion(btn) { abrirModalProduccion(btn.getAttribute('data-id'), btn.getAttribute('data-nombre')); }
    function manejadorModalAjuste(btn) { abrirModalAjuste(btn.getAttribute('data-id'), btn.getAttribute('data-nombre')); }
    function manejadorModalKardex(btn) { abrirKardexPorciones(btn.getAttribute('data-id'), btn.getAttribute('data-nombre')); }
    function manejadorModalEditar(btn) {
        prepararEdicionInsumo(
            btn.getAttribute('data-id'), btn.getAttribute('data-nombre'), btn.getAttribute('data-categoria'),
            btn.getAttribute('data-unidad'), btn.getAttribute('data-actual'), btn.getAttribute('data-minimo')
        );
    }
</script>

<th:block th:replace="~{receta_panel :: panel}"></th:block>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>
<script th:src="@{/js/insumos.js}"></script>
</body>
</html>
