<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(
          title='Gestión de Insumos - La Jama',
          activeUri='/insumos',
          titleHeader='Gestión de Inventario y Recetas',
          content=~{:: #contenido},
          modals=~{:: #modales},
          js='/js/insumos/insumos-core.js'
      )}">
<body>

<div id="contenido">

    <div class="card card-color1 p-4 shadow-sm">

        <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
            <div>
                <h4 class="fw-bold text-dark mb-0">Control de Almacén</h4>
                <p class="text-muted mb-0 small">Gestiona tus proteínas, insumos generales y recetarios</p>
            </div>
            <a th:if="${session.rol == 'ADMIN'}"
               href="#" onclick="abrirModalNuevoInsumo()"
               class="btn btn-jama-kinetic px-4">
                <i class="bi bi-plus-circle me-2"></i> Nuevo Insumo
            </a>
        </div>

        <div class="radio-inputs-jama mb-4">
            <label class="radio-jama" onclick="cambiarPestañaAsincrona('proteinas')">
                <input type="radio" name="moduloInsumos" id="radio-btn-proteinas" checked>
                <span class="name-jama">
                    <i class="bi bi-heptagon-half"></i> Porciones
                </span>
            </label>

            <label class="radio-jama" onclick="cambiarPestañaAsincrona('catalogo')">
                <input type="radio" name="moduloInsumos" id="radio-btn-catalogo">
                <span class="name-jama">
                    <i class="bi bi-box-seam"></i> Catálogo
                </span>
            </label>

            <label th:if="${session.rol == 'ADMIN'}" class="radio-jama" onclick="cambiarPestañaAsincrona('recetas')">
                <input type="radio" name="moduloInsumos" id="radio-btn-recetas">
                <span class="name-jama">
                    <i class="bi bi-journal-check"></i> Recetas
                </span>
            </label>
        </div>

        <div class="tab-content">

            <div id="pane-proteinas" class="tab-pane-jama">
                <th:block th:replace="~{Insumosproteinas :: #contenido_submodulo}"></th:block>
            </div>

            <div id="pane-catalogo" class="tab-pane-jama d-none">
                <th:block th:replace="~{Insumoscatalogo :: #contenido_submodulo}"></th:block>
            </div>

            <div id="pane-recetas" class="tab-pane-jama d-none" th:if="${session.rol == 'ADMIN'}">
                <th:block th:replace="~{Insumosgestion :: #contenido_submodulo}"></th:block>
            </div>

        </div>

    </div> <script th:src="@{/js/insumos/insumos-ajuste.js}"></script>
    <script th:src="@{/js/insumos/insumos-kardex.js}"></script>
    <script th:src="@{/js/insumos/insumos-lote.js}"></script>
    <script th:src="@{/js/insumos/insumos-produccion.js}"></script>
    <script th:src="@{/js/insumos/insumos-recetas.js}"></script>

</div>

<div id="modales">
    <th:block th:replace="~{modales_insumos :: modales}"></th:block>
</div>

</body>
</html>
