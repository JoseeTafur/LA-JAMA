<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(title='Perfiles', content=~{::#contenido}, modals=~{::#modales}, js='/js/perfiles.js')}">
<body>

<div id="contenido">
    <div class="card rounded-lg card-color1">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="card-title h5 fw-bold">Lista de Roles del Sistema</h1>

                <button type="button" id="btnNuevoRegistro" class="btn-jama-kinetic">
                    <i class="bi bi-plus-lg"></i>
                    <span>Nuevo Registro</span>
                </button>
            </div>

            <div class="table-responsive-jama">
                <table id="tabla" class="table table-jama responsive" style="width: 100%">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div id="modales">
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Agregar Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form" novalidate>
                    <div class="modal-body p-4">
                        <input type="hidden" id="id" name="id" />

                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Rol</label>
                            <input type="text" id="nombre" class="form-control" placeholder="Ej. Administrador, Cocinero..." required />
                            <div id="nombre-error" class="invalid-feedback d-block"></div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" class="form-control" rows="3" placeholder="Define las responsabilidades de este perfil..." required></textarea>
                            <div id="descripcion-error" class="invalid-feedback d-block"></div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="permisosModal" class="modal fade" tabindex="-1" aria-labelledby="permisosModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header" style="background-color: var(--lajama-skin) !important;">
                    <h5 class="modal-title text-dark"><i class="bi bi-lock-fill me-2"></i>Asignar Permisos</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formPermisos">
                        <input type="hidden" id="permisoPerfilId" />
                        <div class="alert alert-warning border-0 rounded-4 mb-4" style="background-color: var(--lajama-cream); border: 1px solid var(--lajama-peach) !important;">
                            <i class="bi bi-exclamation-triangle-fill me-2 text-warning"></i>
                            Seleccione los módulos a los que tendrá acceso el perfil:
                            <strong id="permisoPerfilNombre" class="d-block mt-1 text-dark"></strong>
                        </div>

                        <div id="listaOpciones" class="list-group list-group-flush rounded-4 overflow-hidden border border-jama-peach">
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0 px-4 pb-4">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" id="btnGuardarPermisos" class="btn btn-primary">Guardar Permisos</button>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
