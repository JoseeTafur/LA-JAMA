<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

<div id="contenido_submodulo">
    <div class="card card-color1 p-4 shadow-sm">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 border-bottom pb-3 mb-3">
            <div>
                <h5 class="fw-bold mb-0 text-dark">Kardex de Respaldo e Insumos Archivados</h5>
                <small class="text-muted">Lista de elementos inactivos fuera de producción. Solo auditoría histórica.</small>
            </div>
            <div class="input-group shadow-sm" style="max-width: 350px;">
                <span class="input-group-text bg-white border-end-0 rounded-start-pill">
                    <i class="bi bi-search text-muted"></i>
                </span>
                <input type="text" id="buscadorArchivados"
                       class="form-control border-start-0 rounded-end-pill ps-0"
                       placeholder="Buscar en archivados..."
                       onkeyup="filtrarTablaArchivados()">
            </div>
        </div>

        <div class="table-responsive-jama">
            <table class="table table-jama align-middle mb-0" id="tablaArchivados">
                <thead>
                <tr>
                    <th class="ps-4">Insumo</th>
                    <th>Categoría</th>
                    <th>Último Stock</th>
                    <th>Und. Medida</th>
                    <th class="text-center pe-4">Acciones de Respaldo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="insumo : ${insumosArchivados}">
                    <td class="ps-4 fw-semibold text-muted text-decoration-line-through" th:text="${insumo.nombre}"></td>
                    <td>
                        <span class="badge bg-light text-secondary border px-2 py-1 rounded-pill small" th:text="${insumo.categoria}"></span>
                    </td>
                    <td class="fw-bold text-secondary" th:text="${insumo.stockActual != null ? insumo.stockActual : 0.0}"></td>
                    <td class="text-muted" th:text="${insumo.unidadMedida}"></td>
                    <td class="text-center pe-4" style="width: 1%; white-space: nowrap;">
                        <div class="d-flex align-items-center justify-content-center gap-2">

                            <button type="button" class="btn btn-sm btn-action-status is-active border rounded-pill px-3"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}"
                                    onclick="confirmarRestauracion(this.getAttribute('data-id'), this.getAttribute('data-nombre'))"
                                    title="Restaurar Insumo y devolver a producción">
                                <i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar
                            </button>

                            <button th:if="${session.rol == 'SUPER_ADMIN'}" type="button"
                                    class="btn btn-sm btn-danger rounded-pill px-3"
                                    th:data-id="${insumo.id}" th:data-nombre="${insumo.nombre}"
                                    onclick="confirmarPurgaDefinitiva(this.getAttribute('data-id'), this.getAttribute('data-nombre'))"
                                    title="Purga física de Base de Datos" style="font-size: 0.75rem; font-weight: bold;">
                                <i class="bi bi-trash3-fill me-1"></i> Purgar
                            </button>

                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mt-3 pt-3 border-top">
            <div id="infoRegistrosArchivados" class="text-muted small fw-semibold">
                Mostrando registros del 0 al 0 de un total de 0 registros
            </div>

            <div class="d-flex align-items-center gap-4 flex-wrap">
                <div class="jama-length-changer">
                    <span>Mostrar</span>
                    <select id="registrosPorPaginaArchivados" class="select-jama-pages" onchange="cambiarLimiteFilasArchivados()">
                        <option value="10" selected>10</option>
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                    </select>
                    <span>registros</span>
                </div>
                <ul id="paginadorArchivados" class="jama-pagination-wrapper"></ul>
            </div>
        </div>

    </div>
</div>

</body>
</html>
