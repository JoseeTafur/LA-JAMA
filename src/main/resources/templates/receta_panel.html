<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="panel" class="col-lg-4" th:if="${session.rol == 'ADMIN'}">

    <div class="card-jama card-jama-green mb-4">
        <div class="card-body p-4">
            <h6 class="fw-bold mb-3 text-white"><i class="bi bi-link-45deg me-2"></i>Armar Receta</h6>
            <form method="post" id="formAsignar" th:action="@{/insumos/producto/0/agregar}">
                <div class="mb-3">
                    <select name="idProductoSelect" class="form-select form-select-sm rounded-3" id="selectProducto" onchange="actualizarAccion(this.value)">
                        <option value="">Selecciona un plato...</option>
                        <option th:each="p : ${productos}" th:value="${p.id}" th:text="${p.nombre}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <select name="idInsumo" class="form-select form-select-sm rounded-3">
                        <option value="">Selecciona el insumo...</option>
                        <option th:each="ins : ${insumos}" th:if="${ins.categoria != 'PROTEINA'}" th:value="${ins.id}" th:text="${ins.nombre + ' (' + ins.unidadMedida + ')'}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <input type="number" step="0.01" name="cantidad" class="form-control form-control-sm rounded-3" placeholder="Cantidad requerida (Ej: 0.2)"/>
                </div>
                <button type="submit" class="btn btn-light btn-sm w-100 fw-bold text-dark rounded-pill">Asignar a Plato</button>
            </form>
        </div>
    </div>

    <div class="card-jama mb-4">
        <div class="card-body p-3">
            <h6 class="fw-bold mb-3 text-dark border-bottom pb-2">Recetarios Activos</h6>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center px-0" th:each="p : ${productos}">
                    <span class="fw-semibold text-secondary small" th:text="${p.nombre}"></span>
                    <button type="button" class="btn btn-sm btn-jama-outline rounded-pill py-0 px-2 btn-ver-receta" th:data-id="${p.id}" th:data-nombre="${p.nombre}">
                        <i class="bi bi-eye"></i> Ver
                    </button>
                </li>
            </ul>
        </div>
    </div>

</div>
</body>
</html>
