<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, modals, js)">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${title}">La Jama</title>
    <th:block th:replace="~{links :: headLinks}"></th:block>
    <link th:href="@{/css/layout-gestion.css}" rel="stylesheet" />
    <link th:href="@{/css/notificaciones-modernas.css}" rel="stylesheet" />
</head>
<body>
<div class="wrapper">
    <div th:replace="~{sidebar :: sidebar(activeUri=${activeUri})}"></div>

    <main id="main-content" class="main-content">
        <div th:replace="~{sidebar :: logistica_header(${titleHeader ?: title})}"></div>

        <div class="container-fluid p-4">
            <th:block th:replace="${content}"></th:block>
        </div>
    </main>
</div>

<th:block th:replace="${modals}"></th:block>

<div id="notification-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2070;"></div>

<!-- 🟩 COMPONENTE CENTRALIZADO: BUZÓN OPERATIVO CINÉTICO (La Jama UI Master) -->
<div class="posicion-buzon-flotante" style="position: fixed; bottom: 25px; right: 25px; z-index: 2065;">
    <!-- Botón Gatillo Circular Premium -->
    <button type="button" class="btn text-white rounded-circle shadow-lg d-flex align-items-center justify-content-center"
            id="btnBuzonNotificaciones" style="width: 56px; height: 56px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);"
            onclick="alternarDespliegueBuzon()">
        <i class="bi bi-bell-fill fs-4"></i>
        <span id="contador-notif-buzon" class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger d-none animate__animated animate__heartBeat animate__infinite"
              style="font-size: 0.72rem; padding: 4px 7px; background-color: #ff8a00 !important; color: #17251d !important; font-weight: 800;">0</span>
    </button>

    <!-- Mini-Centro de Notificaciones (Popover Estilo Chat) -->
    <div id="popoverNotificaciones" class="card border-0 shadow-lg d-none"
         style="position: absolute; bottom: 75px; right: 0; width: 380px; border-radius: 18px; overflow: hidden;">
        <div class="card-header d-flex justify-content-between align-items-center" style="padding: 1rem 1.25rem;">
            <div class="d-flex align-items-center gap-2">
                <div class="pulsador-activo"></div>
                <span class="fw-bold small" style="letter-spacing: 0.5px; font-size: 0.9rem;">Flujo de Operaciones</span>
            </div>
            <button class="btn btn-sm text-white-50 p-0 text-decoration-none btn-limpiar-buzon" onclick="limpiarBuzonGradual()">
                <i class="bi bi-trash3-fill me-1"></i> Despejar
            </button>
        </div>
        <!-- Cuerpo del chat operativo -->
        <div class="card-body p-3 d-flex flex-column gap-2" id="cuerpo-micro-notificaciones"
             style="max-height: 380px; overflow-y: auto; background-color: #faf6ee;">
            <div class="text-center text-muted py-5 small" id="aviso-buzon-vacio">
                <i class="bi bi-chat-square-heart d-block fs-2 mb-2" style="color: #cbd5e1;"></i>
                <span class="fw-semibold text-secondary" style="font-size: 0.85rem;">Salón sincronizado y al día</span>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{links :: scriptLinksPlus}"></th:block>

<script th:inline="javascript">
    window.APP_CONFIG = {
        imageBaseUrl: /*[[${imageBaseUrl}]]*/ 'https://res.cloudinary.com/dyjnbddit/image/upload/'
    };
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.0/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

<script th:src="@{/js/utiles-comunes.js}"></script>
<script th:src="@{/js/notificaciones-globales.js}"></script> <script th:src="@{/js/seguridad-global.js}"></script>
<script th:src="@{/js/sidebar.js}"></script>
<script th:src="@{/js/main.js}"></script>
<script th:src="@{/js/validation.js}"></script>
<script th:src="@{{path}(path=${js})}"></script>
</body>
</html>
