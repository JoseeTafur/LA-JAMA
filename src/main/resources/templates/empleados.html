<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout-gestion :: layout(title='Empleados', content=~{::#contenido}, modals=~{::#modales}, js='/js/empleados.js')}">
<body>

<div id="contenido">
    <div class="card rounded-lg card-color1">
        <div class="card-body">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                <h1 class="card-title h5 fw-bold">Lista de Empleados</h1>

                <div class="d-flex align-items-center gap-3 w-sm-100 justify-content-end">
                    <select id="filtroTurno" class="form-select filtro-jama" style="width:auto;">
                        <option value="">Todos los turnos</option>
                        <option value="DIA">Turno Día</option>
                        <option value="NOCHE">Turno Noche</option>
                    </select>

                    <button type="button" id="btnNuevoRegistro" class="btn-jama-kinetic">
                        <i class="bi bi-person-plus-fill"></i>
                        <span>Nuevo Registro</span>
                    </button>
                </div>
            </div>

            <div class="table-responsive-jama">
                <table id="tabla" class="table table-jama responsive" style="width: 100%">
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Apellidos y Nombres</th>
                        <th>DNI</th>
                        <th>Cargo</th>
                        <th>Turno</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

<div id="modales">
    <div class="modal fade" id="modal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Agregar Empleado</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="form" novalidate>
                    <div class="modal-body p-4">
                        <input type="hidden" id="id" name="id" />
                        <div class="row g-3">

                            <div class="col-md-6">
                                <label for="id_usuario" class="form-label">Cuenta de Usuario</label>
                                <select id="id_usuario" class="form-select">
                                    <option value="">-- Sin acceso (Solo personal) --</option>
                                </select>
                                <div id="id_usuario-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input id="nombre" type="text" class="form-control" placeholder="Ej. Carlos" />
                                <div id="nombre-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="apellido" class="form-label">Apellido</label>
                                <input id="apellido" type="text" class="form-control" placeholder="Ej. Mendoza" />
                                <div id="apellido-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="dni" class="form-label">DNI</label>
                                <input id="dni" type="text" class="form-control" maxlength="8" placeholder="12345678" />
                                <div id="dni-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input id="telefono" type="text" class="form-control" maxlength="15" placeholder="999000111" />
                                <div id="telefono-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="id_cargo" class="form-label">Cargo</label>
                                <select id="id_cargo" class="form-select">
                                    <option value="">Cargando cargos...</option>
                                </select>
                                <div id="id_cargo-error" class="invalid-feedback d-block"></div>
                            </div>

                            <div class="col-md-6">
                                <label for="turno" class="form-label">Turno</label>
                                <select id="turno" class="form-select">
                                    <option value="DIA">Turno Día (08:00 - 18:00)</option>
                                    <option value="NOCHE">Turno Noche (18:00 - 22:00)</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="tipoContrato" class="form-label">Tipo de Contrato</label>
                                <select id="tipoContrato" class="form-select">
                                    <option value="PLANILLA">Planilla</option>
                                    <option value="EVENTUAL">Eventual</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label for="fechaIngreso" class="form-label">Fecha de Ingreso</label>
                                <input id="fechaIngreso" type="date" class="form-control" />
                            </div>

                        </div>
                    </div>
                    <div class="modal-footer border-0 px-4 pb-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Empleado</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
